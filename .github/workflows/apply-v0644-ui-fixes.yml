name: Apply V0.6.4.4 UI Fixes

on:
  push:
    paths:
      - '.github/workflows/apply-v0644-ui-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Finish V0.6.4.4 cache and DEV patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          game = Path('js/game.js')
          text = game.read_text(encoding='utf-8')
          text = text.replace('// DRAGON BOARD V0.6.4.2', '// DRAGON BOARD V0.6.4.4', 1)
          game.write_text(text, encoding='utf-8')

          dev = Path('js/dev-bootstrap.js')
          text = dev.read_text(encoding='utf-8')
          text = text.replace('// DRAGON BOARD V0.6.4.2 — developer runtime bootstrap', '// DRAGON BOARD V0.6.4.4 — developer runtime bootstrap', 1)
          text = text.replace("js/game.js?v=0642-dev", "js/game.js?v=0644-dev", 1)
          dev.write_text(text, encoding='utf-8')

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          text = text.replace('js/dev-bootstrap.js?v=0643', 'js/dev-bootstrap.js?v=0644')
          text = text.replace('js/divine-blessing-ux.js?v=0630', 'js/divine-blessing-ux.js?v=0644')
          index.write_text(text, encoding='utf-8')
          PY

          node --check js/game.js
          node --check js/dev-bootstrap.js
          node --check js/combat-item-ux.js
          node --check js/divine-blessing-ux.js

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/game.js js/dev-bootstrap.js index.html
          if git diff --cached --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git commit -m "Finish DEV cache bump for V0.6.4.4"
          git push origin HEAD:main
