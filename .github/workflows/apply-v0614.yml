name: Apply V0.6.1.4 real 3D dice
on:
  push:
    branches: [ main ]
    paths:
      - '.github/patch_v0614.py'
      - '.github/workflows/apply-v0614.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply real 3D dice patch
        run: |
          python .github/patch_v0614.py
          node --check js/game.js
          node --check js/board3d.js
          node --check js/board3d-play.js
          grep -q 'startSceneDiceRoll' js/board3d.js
          grep -q 'settleSceneDice' js/board3d.js
          grep -q 'PROTOTYPE V0.6.1.4' index.html
      - name: Commit and push
        run: |
          rm -f .github/patch_v0614.py .github/workflows/apply-v0614.yml
          rm -f .github/patch_v0613.py .github/workflows/apply-v0613.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Patch V0.6.1.4' || exit 0
          git push origin main
