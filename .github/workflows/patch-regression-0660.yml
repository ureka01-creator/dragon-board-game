name: Patch V0.6.6.0 regression driver

on:
  push:
    branches:
      - agent/final-dungeon-0660
    paths:
      - '.github/workflows/patch-regression-0660.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-dungeon-0660
      - name: Update legacy final-dungeon regression driver
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/regression.spec.cjs')
          text = p.read_text()

          marker = """async function beginPreparedMove(page, targetId) {
          """
          helper = """async function advanceFinalDungeonUx(page) {
            const actions = [
              ['.final-dungeon-roll-btn', 420],
              ['.final-dungeon-continue-btn', 260],
              ['.final-dungeon-altar-continue', 180],
              ['.final-dungeon-throne-open', 260],
              ['.final-dungeon-enter', 260],
            ];
            for (const [selector, waitMs] of actions) {
              const action = page.locator(selector).first();
              if (await action.isVisible()) {
                await action.evaluate(el => el.click());
                await page.waitForTimeout(waitMs);
                return true;
              }
            }
            return false;
          }

          """
          if 'async function advanceFinalDungeonUx(page)' not in text:
              if marker not in text:
                  raise SystemExit('beginPreparedMove marker not found')
              text = text.replace(marker, helper + marker, 1)

          old_full = """    const modal = page.locator('#modal');
              if (await modal.isVisible()) {
                const enter = page.locator('.final-dungeon-enter');
                if (await enter.isVisible()) await enter.evaluate(el => el.click());
                else {
                  const close = page.locator('#modalCloseBtn');
                  if (await close.isVisible()) await close.evaluate(el => el.click());
                }
                await page.waitForTimeout(180);
                continue;
              }
          """
          new_full = """    const modal = page.locator('#modal');
              if (await modal.isVisible()) {
                if (await advanceFinalDungeonUx(page)) continue;
                const close = page.locator('#modalCloseBtn');
                if (await close.isVisible()) await close.evaluate(el => el.click());
                await page.waitForTimeout(180);
                continue;
              }
          """
          if old_full in text:
              text = text.replace(old_full, new_full, 1)

          old_defeat = """    if (await page.locator('#modal').isVisible()) {
                const close = page.locator('#modalCloseBtn');
                if (await close.isVisible()) await close.evaluate(el => el.click());
                await page.waitForTimeout(180);
                continue;
              }
          """
          new_defeat = """    if (await page.locator('#modal').isVisible()) {
                if (await advanceFinalDungeonUx(page)) continue;
                const close = page.locator('#modalCloseBtn');
                if (await close.isVisible()) await close.evaluate(el => el.click());
                await page.waitForTimeout(180);
                continue;
              }
          """
          if old_defeat in text:
              text = text.replace(old_defeat, new_defeat, 1)

          if text.count('await advanceFinalDungeonUx(page)') != 2:
              raise SystemExit('expected two final-dungeon regression call sites')
          p.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/regression.spec.cjs
          if git diff --cached --quiet; then
            echo "Regression driver already migrated"
            exit 0
          fi
          git commit -m "Update final dungeon regression driver"
          git push origin HEAD:agent/final-dungeon-0660
