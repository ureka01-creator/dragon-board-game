name: Apply Extended Regression Coverage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-extended-regression.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extend regression coverage
        run: |
          python3 scripts/extend_regression_coverage.py
          python3 -c "from pathlib import Path; p=Path('tests/regression.spec.cjs'); p.write_text(p.read_text().rstrip() + chr(10))"
      - name: Commit extended tests
        run: |
          git config user.name "ureka01-creator"
          git config user.email "ureka01@nate.com"
          git add tests/regression.spec.cjs
          git diff --cached --check
          git commit -m "Extend V0.6.3.8 regression coverage"
          git push
