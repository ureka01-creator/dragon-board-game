name: Apply V0.5.6.6 patch

on:
  push:
    branches: [main]
    paths:
      - '.github/v0566.patch'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: |
          git apply --check .github/v0566.patch
          git apply .github/v0566.patch
          git rm .github/v0566.patch .github/workflows/apply-v0566.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md css/style.css index.html js/game.js
          git commit -m "Patch V0.5.6.6"
          git push
