name: Apply V0.5.9.2 status items

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'stage V0.5.9.2 workflow retry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate V0.5.9.2
        run: |
          python3 -m py_compile .github/apply_v0592.py
          python3 .github/apply_v0592.py
          node --check js/game.js
          grep -q 'DRAGON BOARD V0.5.9.2' js/game.js
          grep -q 'objective-explore' js/game.js
          grep -q 'bindStatusItemLongPress' js/game.js
          grep -q 'data-status-swap-index' js/game.js
          grep -q 'PROTOTYPE V0.5.9.2' index.html
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/apply_v0592.py .github/workflows/apply-v0592.yml
          git add js/game.js css/style.css index.html README.md
          git commit -m "Patch V0.5.9.2"
          git push
