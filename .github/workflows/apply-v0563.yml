name: Apply V0.5.6.3 patch

on:
  push:
    branches: [main]
    paths:
      - 'v0563.patch'

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.event.head_commit.message == 'stage v0.5.6.3 patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V0.5.6.3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git apply --check v0563.patch
          git apply v0563.patch
          rm v0563.patch
          git add README.md css/style.css index.html js/game.js js/map.js v0563.patch
          git commit -m "Patch V0.5.6.3"
          git push origin HEAD:main
