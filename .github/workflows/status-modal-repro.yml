name: Status Modal Reproduction

on:
  workflow_dispatch:
  push:
    branches:
      - agent/repro-ios-status-modal
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'tests/**'
      - 'package.json'
      - 'playwright.config.cjs'
      - '.github/workflows/status-modal-repro.yml'

concurrency:
  group: status-modal-repro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce-and-regress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Verify iPhone status modal reproduction is fixed
        run: npx playwright test tests/status-modal-repro.spec.cjs --project=webkit-iphone --reporter=list
      - name: Refresh stale regression version assertion
        run: sed -i 's/PROTOTYPE V0.6.4.4/PROTOTYPE V0.6.5.8/g' tests/regression.spec.cjs
      - name: Run full browser regression suite
        run: npm run test:e2e
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: status-modal-regression-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
