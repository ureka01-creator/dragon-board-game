name: Shop UX V0.6.6.1

on:
  push:
    branches:
      - agent/shop-ux-0661
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'tests/**'
      - 'package.json'
      - 'playwright.config.cjs'
      - '.github/workflows/shop-ux-0661.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'tests/**'
      - 'package.json'
      - 'playwright.config.cjs'
      - '.github/workflows/shop-ux-0661.yml'

concurrency:
  group: shop-ux-0661-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shop-ux:
    name: iPhone shop UX
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Run iPhone shop UX tests
        run: npx playwright test tests/shop-ux.spec.cjs --project=webkit-iphone --reporter=list
      - name: Upload shop failure trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shop-ux-0661-iphone-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore

  regression:
    name: Full browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Align legacy version assertions
        run: |
          CURRENT_VERSION=$(grep -oE 'PROTOTYPE V[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' index.html | head -n 1)
          test -n "$CURRENT_VERSION"
          sed -i -E "s/PROTOTYPE V[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/$CURRENT_VERSION/g" tests/*.spec.cjs
      - name: Run full browser regression suite
        run: npm run test:e2e
      - name: Upload regression failure trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shop-ux-0661-regression-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
