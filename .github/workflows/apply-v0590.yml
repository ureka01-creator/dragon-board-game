name: Apply V0.5.9.0 patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'stage V0.5.9.0 patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V0.5.9.0 direct transform
        run: |
          python .github/apply_v0590_direct.py
          node --check js/game.js
          node --check js/events.js
          if rg -n "state\.threat|DRAGON THREAT|type:'threat'|threatValue|threatFill|sealQuests|questProgress|addQuestProgress|setupSealQuests" js/game.js js/events.js index.html; then
            echo "Legacy THREAT/seal quest reference remains"
            exit 1
          fi
          git rm .github/v0590.patch .github/apply_v0590_direct.py .github/workflows/apply-v0590.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.html css/style.css js/game.js js/events.js
          git commit -m "Patch V0.5.9.0"
          git push
