name: Apply V0.6.4.2 Event Expansion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v0642-event-expansion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply event expansion
        run: python3 scripts/apply-v0642-event-expansion.py
      - name: Validate JavaScript and patch
        run: |
          node --check js/events.js
          node --check js/map.js
          node --check js/game.js
          node --check js/dev-bootstrap.js
          node --check tests/event-expansion.spec.cjs
          grep -q 'PROTOTYPE V0.6.4.2' index.html
          grep -q "eventDeckRegion" js/game.js
          grep -q "events:nodes.filter(node => node.type === '사건').length" tests/event-expansion.spec.cjs
          git diff --check
      - name: Commit V0.6.4.2
        run: |
          git config user.name "dragon-board-ci"
          git config user.email "actions@users.noreply.github.com"
          git add index.html js/events.js js/map.js js/game.js js/dev-bootstrap.js tests/regression.spec.cjs tests/dev-tools.spec.cjs tests/event-expansion.spec.cjs
          git commit -m "Expand map events for V0.6.4.2"
          git push
