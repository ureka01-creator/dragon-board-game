name: Diagnose Extended Regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-extended.yml'

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-mobile, webkit-iphone]
        case:
          - portal-enter
          - portal-pass
          - village-rest
          - village-pass
          - shop-buy-sell
          - revive
          - castle-reenter
          - castle-progress
    runs-on: ubuntu-latest
    name: ${{ matrix.project }} / ${{ matrix.case }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Run case
        shell: bash
        run: |
          case "${{ matrix.case }}" in
            portal-enter) pattern='portal enter keeps remaining MOVE active in the destination region' ;;
            portal-pass) pattern='portal pass continues along the current region with remaining MOVE' ;;
            village-rest) pattern='village rest consumes remaining MOVE and fully recovers the hero' ;;
            village-pass) pattern='village pass keeps moving instead of consuming the turn' ;;
            shop-buy-sell) pattern='shop supports an actual buy and sell before exiting the turn' ;;
            revive) pattern='downed hero revives at the regional village on the next round' ;;
            castle-reenter) pattern='dragon castle can be declined and re-entered repeatedly without freezing' ;;
            castle-progress) pattern='dragon castle keeps cleared stages after a final-boss defeat' ;;
          esac
          npx playwright test tests/regression.spec.cjs --project="${{ matrix.project }}" --grep "$pattern" --reporter=line
