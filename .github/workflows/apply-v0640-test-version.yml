name: Apply V0.6.4.0 Test Version

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v0640-test-version.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch regression version expectation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/regression.spec.cjs')
          text = path.read_text()
          old = "PROTOTYPE V0.6.3.8"
          new = "PROTOTYPE V0.6.4.0"
          if old not in text:
              raise SystemExit(f'missing expected marker: {old}')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit patch
        run: |
          git config user.name "dragon-board-ci"
          git config user.email "actions@users.noreply.github.com"
          git add tests/regression.spec.cjs
          git commit -m "Update regression expectation for V0.6.4.0"
          git push
