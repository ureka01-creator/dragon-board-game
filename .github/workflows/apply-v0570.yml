name: Apply V0.5.7.0 patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'stage V0.5.7.0 patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V0.5.7.0
        run: |
          git apply -p1 --check .github/v0570.patch
          git apply -p1 .github/v0570.patch
          git rm .github/v0570.patch .github/workflows/apply-v0570.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.html js/game.js js/heroes.js
          git commit -m "Patch V0.5.7.0"
          git push
