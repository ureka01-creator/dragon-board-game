name: Regression Baseline 658

on:
  workflow_dispatch:
  push:
    branches:
      - agent/regression-baseline-658
    paths:
      - '.github/workflows/regression-baseline-658.yml'

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run unchanged boot regression
        run: npx playwright test tests/regression.spec.cjs --project=chromium-mobile --grep "boot/version and movement dice animation sequence" --reporter=list
