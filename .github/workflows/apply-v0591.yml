name: Apply V0.5.9.1 objective help

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'stage V0.5.9.1 objective help workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V0.5.9.1
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          game = Path('js/game.js')
          s = game.read_text()
          s = s.replace('// DRAGON BOARD V0.5.9.0', '// DRAGON BOARD V0.5.9.1', 1)
          pattern = r"  function renderCurrentObjective\(\) \{.*?\n  \}\n\n  function renderMap\(\) \{"
          replacement = '''  function renderCurrentObjective() {
            if (!currentObjective) return;
            const areaNodes = WORLD_NODES.filter(n => n.areaId === state.viewAreaId);
            const discovered = areaNodes.filter(n => state.discoveredNodeIds?.has(n.id)).length;
            const boss = getAreaBossNode(state.viewAreaId);
            const bossDefeated = Boolean(boss && state.defeatedBosses.has(boss.id));
            const title = state.dragonCastleSpawned
              ? `🐉 현재 목표 ${state.seals}/4`
              : `🗿 현재 목표 ${state.seals}/4`;
            const detailText = state.dragonCastleSpawned
              ? '봉인석 4개 완성 · 출현한 드래곤의 성을 찾아가자.'
              : (bossDefeated
                ? `🗿 ${getAreaDisplayName(state.viewAreaId)} 봉인석 획득 완료 · 탐험 ${discovered}/${areaNodes.length}`
                : `👑 ${boss?.name || '지역 보스'} 토벌 → 봉인석 획득 · 탐험 ${discovered}/${areaNodes.length}`);

            currentObjective.innerHTML = `<strong>${title}</strong><button class="objective-help-btn" type="button" aria-label="현재 목표 상세 보기">?</button>`;
            const helpBtn = currentObjective.querySelector('.objective-help-btn');
            helpBtn?.addEventListener('click', (event) => {
              event.stopPropagation();
              showModal(state.dragonCastleSpawned ? '🐉 현재 목표' : '🗿 현재 목표', detailText);
            });
          }

          function renderMap() {'''
          s2, count = re.subn(pattern, replacement, s, flags=re.S)
          if count != 1:
            raise SystemExit(f'renderCurrentObjective replacement count={count}')
          game.write_text(s2)

          css = Path('css/style.css')
          c = css.read_text()
          anchor = '.current-objective span { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }'
          addon = '''.current-objective span { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
          .objective-help-btn {
            display:inline-grid; place-items:center; flex:0 0 auto;
            width:20px; height:20px; padding:0; margin:0;
            border:1px solid #7b6745; background:#262116; color:#e5bd62;
            font-size:12px; font-weight:700; line-height:1; cursor:pointer;
            border-radius:50%;
          }
          .objective-help-btn:active { transform:translate(1px,1px); background:#332b1c; }'''
          if anchor not in c:
            raise SystemExit('CSS objective anchor not found')
          c = c.replace(anchor, addon, 1)
          c = c.replace('.current-objective { font-size:8px; gap:5px; padding:5px 6px; }', '.current-objective { font-size:8px; gap:5px; padding:5px 6px; }\n  .objective-help-btn { width:18px; height:18px; font-size:11px; }', 1)
          css.write_text(c)

          index = Path('index.html')
          h = index.read_text()
          h = h.replace('PROTOTYPE V0.5.9.0', 'PROTOTYPE V0.5.9.1', 1)
          h = h.replace('?v=0590', '?v=0591')
          index.write_text(h)

          readme = Path('README.md')
          r = readme.read_text()
          r = r.replace('# DRAGON BOARD — Web Prototype V0.5.9.0', '# DRAGON BOARD — Web Prototype V0.5.9.1', 1)
          block = '''

          ## V0.5.9.1
          - 월드맵 `현재 목표 0/4` 옆에 `?` 도움말 버튼 추가
          - 보스명/봉인석 획득 조건/현재 지역 탐험 진행도를 평소에는 숨겨 모바일 목표 바를 간결하게 정리
          - `?`를 누르면 `지역 보스 토벌 → 봉인석 획득 · 탐험 N/33` 상세 안내를 모달로 표시
          '''
          r = r.replace('\n\n## V0.5.9.0', block + '\n\n## V0.5.9.0', 1)
          readme.write_text(r)
          PY
          node --check js/game.js
          grep -q 'objective-help-btn' js/game.js
          grep -q 'PROTOTYPE V0.5.9.1' index.html
          git rm .github/workflows/apply-v0591.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.html css/style.css js/game.js
          git commit -m "Patch V0.5.9.1"
          git push
