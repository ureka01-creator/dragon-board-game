name: Apply V0.6.3.8 Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v0638-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/apply_v0638.py
      - name: Commit fix
        run: |
          git config user.name "ureka01-creator"
          git config user.email "ureka01@nate.com"
          git add js/game.js index.html tests/regression.spec.cjs README.md
          git diff --cached --check
          git commit -m "Fix special-stop dead ends V0.6.3.8"
          git push
