name: Apply V0.6.1.3 movement bridge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'stage V0.6.1.3 movement workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply direct 3D movement bridge
        run: |
          python .github/patch_v0613.py
          node --check js/game.js
          node --check js/board3d.js
          node --check js/board3d-play.js
          grep -q 'snapHeroToNode' js/game.js
          grep -q 'snapHeroToNode' js/board3d.js
          grep -q 'PROTOTYPE V0.6.1.3' index.html
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.html js/game.js js/board3d.js js/board3d-play.js
          git rm .github/patch_v0613.py .github/workflows/apply-v0613.yml
          git commit -m "Patch V0.6.1.3"
          git push
