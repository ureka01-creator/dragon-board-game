name: Apply Regression Harness Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-regression-harness-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch regression harness
        run: python3 scripts/fix_regression_harness.py
      - name: Commit harness fix
        run: |
          git config user.name "ureka01-creator"
          git config user.email "ureka01@nate.com"
          git add tests/regression.spec.cjs
          git diff --cached --check
          git commit -m "Stabilize V0.6.3.8 regression harness"
          git push
